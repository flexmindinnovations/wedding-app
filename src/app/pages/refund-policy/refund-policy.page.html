<ion-header *ngIf="isMobile" [translucent]="true" class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button icon="arrow-back-outline"></ion-back-button>
    </ion-buttons>
    <ion-title>Refund Policy</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content [fullscreen]="true">
  <div class="content  h-full w-full overflow-auto">
    <section class="_register flex w-full h-full">
      <div class="container flex flex-row gap-4 mx-auto">
      <iframe [src]="'https://docs.google.com/document/d/1777LNuN8UW_H60QvAhb_8O0SgkefIU8J/preview' | safeUrl: 'resourceUrl'" width="100%" height="100%"></iframe>
      </div>
    </section>
    <div class="footer">
      <app-footer></app-footer>
    </div>
  </div>
</ion-content>
